# Render Blueprint (fallback deployment). Free web service built from the Dockerfile.
# NOTE: Render's free plan has no persistent disk — data resets on redeploy/restart.
services:
  - type: web
    name: jobpilot
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: JOBPILOT_ENV
        value: production
      - key: JOBPILOT_DATA_DIR
        value: /data
      - key: JOBPILOT_PERSISTENT_STORAGE
        value: "0"
      - key: JOBPILOT_SECRET_KEY
        generateValue: true
      - key: JOBPILOT_PASSWORD          # legacy: also accepted as the one-time owner setup secret
        sync: false
      - key: OWNER_SETUP_TOKEN          # one-time secret to create the owner account at /setup-owner
        sync: false
      - key: AI_PROVIDER
        value: none
      # Optional integrations — set in the Render dashboard (never commit values):
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM,
      # BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY, BACKUP_S3_REGION,
      # BACKUP_ENCRYPTION_KEY
