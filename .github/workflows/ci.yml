name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-local.txt
      - run: python -m playwright install --with-deps chromium
      - name: Backend + safety tests
        run: python -m pytest tests -q --ignore=tests/e2e_ui.py --ignore=tests/run_e2e.py
      - name: UI end-to-end journeys
        run: python tests/run_e2e.py test-results/e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/e2e-shots
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobpilot:ci .
